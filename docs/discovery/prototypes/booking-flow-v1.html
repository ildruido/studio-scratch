<title>Studio Booking Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; 4 steps (pick class, your details, review, confirmed); a sticky "prototype" banner. */
:root{--bg:#eef2f1;--card:#ffffff;--fg:#17302e;--muted:#5d7270;--line:#d3dedc;--accent:#1f6f68;--accent-fg:#ffffff;--soft:#dcefec;--warn:#9a5b00;--warn-bg:#fdf1d9;
--head:'Bricolage Grotesque','Inter',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1b;--card:#172928;--fg:#e4f0ee;--muted:#93aaa7;--line:#2a4240;--accent:#59c1b6;--accent-fg:#0b1a19;--soft:#1d3a37;--warn:#f0c27a;--warn-bg:#3a2d12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c1b;--card:#172928;--fg:#e4f0ee;--muted:#93aaa7;--line:#2a4240;--accent:#59c1b6;--accent-fg:#0b1a19;--soft:#1d3a37;--warn:#f0c27a;--warn-bg:#3a2d12;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto}
.banner{background:var(--warn-bg);color:var(--warn);font-size:12px;padding:8px 12px;border-radius:8px;margin:12px 0}
h1,h2{font-family:var(--head);margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);margin:2px 0 14px}
.steps{display:flex;gap:6px;margin:14px 0}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.day{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.cls{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:inherit;font:inherit;cursor:pointer}
.cls:hover,.cls:focus-visible{border-color:var(--accent);outline:2px solid transparent}
.cls:focus-visible{outline:2px solid var(--accent)}
.cls[disabled]{opacity:.55;cursor:not-allowed}
.time{font-family:var(--head);font-weight:700;min-width:62px;font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}.grow b{display:block}.grow small{color:var(--muted)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.full{background:var(--warn-bg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:13px;font:600 15px var(--body);cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}.row span:first-child{color:var(--muted)}
.err{color:var(--warn);font-size:13px;margin-top:4px}
.later{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:14px;color:var(--muted);font-size:13px}
.later b{color:var(--warn)}
.tick{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:26px;margin-bottom:10px}
.back{background:none;border:0;color:var(--accent);font:600 14px var(--body);padding:4px 0;cursor:pointer}
</style>
<div class="wrap">
  <div class="banner">Prototype with sample data. Nothing is saved or sent.</div>
  <h1>Still Point Yoga</h1>
  <p class="sub">12 Alder Lane · one-room studio · sample studio</p>
  <div class="steps" aria-hidden="true"><span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span></div>
  <div id="view"></div>
</div>
<script>
var classes=[
 {id:1,day:'Thursday 27 Nov',time:'07:00',name:'Morning Flow',teacher:'Maya',min:60,cap:8,left:3},
 {id:2,day:'Thursday 27 Nov',time:'18:30',name:'Slow Yin',teacher:'Maya',min:75,cap:8,left:0},
 {id:3,day:'Friday 28 Nov',time:'12:15',name:'Lunch Break Stretch',teacher:'Maya',min:45,cap:8,left:6},
 {id:4,day:'Saturday 29 Nov',time:'09:30',name:'Weekend Vinyasa',teacher:'Maya',min:60,cap:8,left:2}
];
var st={step:1,cls:null,name:'',email:'',spots:'1',note:'',err:''};
var v=document.getElementById('view');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bar(){for(var i=1;i<=4;i++)document.getElementById('s'+i).className=i<=st.step?'on':''}
function later(t){return '<div class="later"><b>Later:</b> '+t+'</div>'}
function render(){bar();var h='';
 if(st.step==1){
  h+='<h2>Pick a class</h2><p class="sub">This week. Tap a class to book.</p>';var d='';
  classes.forEach(function(c){
   if(c.day!=d){d=c.day;h+='<div class="day">'+c.day+'</div>'}
   var full=c.left==0;
   h+='<button class="cls" data-id="'+c.id+'"'+(full?' disabled':'')+'><span class="time">'+c.time+'</span><span class="grow"><b>'+c.name+'</b><small>with '+c.teacher+' · '+c.min+' min</small></span><span class="pill'+(full?' full':'')+'">'+(full?'Full':c.left+' left')+'</span></button>'});
  h+=later('Waitlist for full classes, class packs and payment.');
 }else if(st.step==2){
  var c=st.cls;
  h+='<button class="back" id="back">← Back</button><h2>Your details</h2><p class="sub">'+c.name+' · '+c.day+', '+c.time+'</p><div class="card">'
   +'<label for="n">Your name</label><input id="n" autocomplete="name" value="'+esc(st.name)+'">'
   +'<label for="e">Email for your confirmation</label><input id="e" type="email" autocomplete="email" value="'+esc(st.email)+'">'
   +'<label for="sp">Spots</label><select id="sp">';
  for(var i=1;i<=Math.min(2,c.left);i++)h+='<option'+(st.spots==i?' selected':'')+'>'+i+'</option>';
  h+='</select><label for="no">Anything the teacher should know? (optional)</label><input id="no" value="'+esc(st.note)+'" placeholder="e.g. sore lower back">'
   +(st.err?'<div class="err" role="alert">'+st.err+'</div>':'')+'</div><button class="btn" id="next">Review booking</button>'
   +later('Create an account to rebook faster.');
 }else if(st.step==3){
  var c=st.cls;
  h+='<button class="back" id="back">← Back</button><h2>Check and confirm</h2><div class="card">'
   +'<div class="row"><span>Class</span><span>'+c.name+'</span></div><div class="row"><span>When</span><span>'+c.day+', '+c.time+'</span></div>'
   +'<div class="row"><span>Teacher</span><span>'+c.teacher+'</span></div><div class="row"><span>Spots</span><span>'+st.spots+'</span></div>'
   +'<div class="row"><span>Name</span><span>'+esc(st.name)+'</span></div><div class="row"><span>Confirmation to</span><span>'+esc(st.email)+'</span></div></div>'
   +'<p class="sub">Free cancellation up to 4 hours before class (sample rule).</p><button class="btn" id="go">Confirm booking</button>'
   +later('Pay at booking. For now you pay at the studio.');
 }else{
  var c=st.cls;
  h+='<div class="card"><div class="tick">✓</div><h2>You are booked, '+esc(st.name.split(' ')[0])+'</h2><p class="sub">A confirmation would be sent to '+esc(st.email)+'.</p>'
   +'<div class="row"><span>Class</span><span>'+c.name+'</span></div><div class="row"><span>When</span><span>'+c.day+', '+c.time+'</span></div>'
   +'<div class="row"><span>Spots</span><span>'+st.spots+'</span></div><div class="row"><span>Reference</span><span>SP-4821</span></div></div>'
   +'<button class="btn ghost" id="cancel">Cancel this booking</button><button class="btn" id="again">Book another class</button>'
   +later('Add to calendar, reminder the day before, and the owner’s view of who is coming.');
 }
 v.innerHTML=h;window.scrollTo(0,0)}
v.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;
 if(t.classList.contains('cls')){st.cls=classes.filter(function(c){return c.id==t.dataset.id})[0];st.step=2;st.spots='1';render()}
 else if(t.id=='back'){keep();st.step--;st.err='';render()}
 else if(t.id=='next'){keep();if(!st.name.trim()){st.err='Enter your name.'}else if(!/^\S+@\S+\.\S+$/.test(st.email)){st.err='Enter an email like name@example.com.'}else{st.err='';st.step=3}render()}
 else if(t.id=='go'){st.step=4;render()}
 else if(t.id=='cancel'){st.step=1;st.cls=null;render()}
 else if(t.id=='again'){st={step:1,cls:null,name:'',email:'',spots:'1',note:'',err:''};render()}});
function keep(){var n=document.getElementById('n');if(n){st.name=n.value;st.email=document.getElementById('e').value;st.spots=document.getElementById('sp').value;st.note=document.getElementById('no').value}}
render();
</script>
