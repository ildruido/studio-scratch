<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scratch</title>
  </head>
  <body>
    <main class="wrap">
      <header>
        <p class="eyebrow">Habit Tracker</p>
        <h1 id="page-title" tabindex="-1">Scratch</h1>
      </header>
      <form id="add-form">
        <label for="habit-name">New habit</label>
        <input id="habit-name" type="text" maxlength="60" autocomplete="off" />
        <button id="add-button" type="submit">Add</button>
      </form>
      <p id="add-hint" role="status"></p>
      <p id="empty">No habits yet. Add your first habit above to get started.</p>
      <ul id="habit-list"></ul>
      <footer id="about">About: Habit Tracker</footer>
      <p id="built-with">Built with the studio harness</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
